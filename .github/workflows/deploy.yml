name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      bootstrap_state:
        description: Generate FTP state for files already on the server without deploying
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      # Migrations are not run by this workflow (there is no shell on the host). Flag them so they
      # are applied on the server before the new code takes traffic.
      - name: Flag new migrations
        run: |
          new=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- database/migrations || true)
          if [ -n "$new" ]; then
            echo "::warning title=Migrations to run::This deploy adds migrations. Run 'php artisan migrate --force' on the server (ideally before this deploy): $(echo $new | tr '\n' ' ')"
            { echo "### Migrations to run on the server"; echo '```'; echo "$new"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: composer test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --classmap-authoritative

      - name: Deploy application files
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ vars.FTP_HOST }}
          port: ${{ vars.FTP_PORT }}
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          timeout: 120000
          dry-run: ${{ inputs.bootstrap_state == true }}
          exclude: |
            **/.env*
            **/.git*
            **/.git*/**
            **/.github/**
            **/.agents/**
            **/.codex/**
            **/node_modules/**
            **/storage/**
            **/tests/**
            **/bootstrap/cache/config.php
            **/bootstrap/cache/events.php
            **/bootstrap/cache/routes*.php
            **/phpunit.xml
            **/pint.json
            **/*.md
            **/*.sh
            .editorconfig
            .npmrc
            API y modelos.dc.html

      - name: Save bootstrap state
        if: ${{ inputs.bootstrap_state }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ftp-deploy-sync-state
          path: .ftp-deploy-sync-state.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # The files are already uploaded at this point. The host firewall may block GitHub runner
      # IPs, so an unreachable API is reported as a warning instead of failing the deploy.
      - name: Verify deployment
        if: ${{ !inputs.bootstrap_state }}
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 5 --retry-all-errors https://ikkeapi.fragua.com.ar/up \
            || { echo "::warning::Could not reach https://ikkeapi.fragua.com.ar/up from the runner; verify the deployment manually."; exit 1; }
